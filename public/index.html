<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Villa Azul · Turismo & Excursiones</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>(function(){ try{ var t=localStorage.getItem('va_tema'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){} })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#0C1A2E; --muted:#536077; --line:#D9DFE8;
  --brand:#1E4FD1; --brand-ink:#FFFFFF; --brand-soft:#E3EBFD; --night:#0B1B33; --night-2:#132A4E;
  --ok:#0F7A55; --ok-soft:#DDF3EA; --bad:#C0392F; --bad-soft:#FBE3E0; --warn:#9A5B00; --warn-soft:#FDF0D9;
  --shadow:0 1px 2px rgba(12,26,46,.06),0 8px 24px rgba(12,26,46,.06);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --t-fast:140ms; --t:220ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090F1A; --surface:#111A29; --surface-2:#182335; --ink:#E8EDF5; --muted:#9AA6BA; --line:#243149;
    --brand:#7DA2FF; --brand-ink:#0A1630; --brand-soft:#1A2A4D; --night:#050B16; --night-2:#0E1E3A;
    --ok:#45C99A; --ok-soft:#12352A; --bad:#FF8A7E; --bad-soft:#3A1C1A; --warn:#F2B54C; --warn-soft:#3A2C12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090F1A; --surface:#111A29; --surface-2:#182335; --ink:#E8EDF5; --muted:#9AA6BA; --line:#243149;
  --brand:#7DA2FF; --brand-ink:#0A1630; --brand-soft:#1A2A4D; --night:#050B16; --night-2:#0E1E3A;
  --ok:#45C99A; --ok-soft:#12352A; --bad:#FF8A7E; --bad-soft:#3A1C1A; --warn:#F2B54C; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);touch-action:pan-x pan-y}
/* v5.2: la pantalla no se agranda ni se corre de lado. Lo que no entra se ajusta dentro de su caja. */
html,body{overflow-x:clip;max-width:100%}
@supports not (overflow:clip){body{overflow-x:hidden}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.oculto{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}

/* ═══ Acceso ═══ */
.acceso{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--night) 0%,var(--night-2) 100%);color:#EAF0FB;padding:22px 20px 70px}
.hero svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.hero .fila{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px}
.marca .logo{width:38px;height:38px}
.marca b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.marca span{display:block;font-size:12.5px;opacity:.75;font-weight:500}
.hero h1{position:relative;margin-top:44px;font-size:clamp(30px,8vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.02;max-width:12ch}
.hero p.sub{position:relative;margin-top:10px;opacity:.78;max-width:34ch}
.tarjeta-acceso{position:relative;margin:-44px auto 0;width:min(560px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px;align-self:start}
.tarjeta-acceso h2{font-size:17px;font-weight:700;margin-bottom:14px}
.usuarios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.u-card{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color var(--t-fast),background-color var(--t-fast),transform var(--t-fast)}
.u-card:hover{border-color:var(--brand);background:var(--brand-soft)}
.u-card:active{transform:scale(.98)}
.u-card > span:last-child{min-width:0;max-width:100%}
.u-card .avatar{width:36px;height:36px;border-radius:10px;font-size:13.5px}
.u-card b{display:block;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-card small{display:block;color:var(--muted);font-size:13px}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--brand-soft);color:var(--brand)}
.avatar.op{background:var(--ok-soft);color:var(--ok)}
.avatar.su{background:var(--night);color:#EAF0FB}
.avatar.grande{width:64px;height:64px;font-size:22px;border-radius:18px}
.pin{display:flex;flex-direction:column;align-items:center;text-align:center}
.pin .quien{display:flex;flex-direction:column;align-items:center;gap:8px}
.pin .quien b{font-size:20px;font-weight:800}
.pin .quien small{color:var(--muted)}
.puntos{display:flex;gap:14px;margin:22px 0 6px}
.puntos i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background-color var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.puntos i.lleno{background:var(--brand);border-color:var(--brand);transform:scale(1.12)}
.puntos.mal{animation:temblor .38s var(--ease)}
.puntos.mal i{border-color:var(--bad)}
@keyframes temblor{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pin .msg{min-height:1.5em;font-size:14px;color:var(--bad);font-weight:600}
.teclado{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:10px}
.teclado button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;transition:background-color var(--t-fast),transform var(--t-fast)}
.teclado button:active{transform:scale(.94);background:var(--brand-soft)}
.teclado button.nada{visibility:hidden}
.teclado button.borrar{background:transparent;border-color:transparent;display:grid;place-items:center}
.enlace{background:none;border:none;color:var(--brand);font-weight:700;padding:12px;margin-top:6px}

/* ═══ Selector de tema ═══ */
.tema{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.tema button{border:none;background:transparent;color:inherit;width:36px;height:32px;border-radius:9px;display:grid;place-items:center;opacity:.7}
.tema button[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1}
.tema.claro{background:var(--surface-2);border-color:var(--line)}
.tema.claro button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tema .ico{width:18px;height:18px}

/* ═══ Estructura de la app ═══ */
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
.barra-sup{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
body.en-app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.barra-sup .logo{width:30px;height:30px}
.barra-sup h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.senal{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ok)}
.senal .p{width:8px;height:8px;border-radius:50%;background:currentColor}
.senal.off{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.senal .cuenta{background:var(--warn);color:var(--surface);border-radius:999px;padding:0 7px;font-size:12px}
.btn-avatar{border:none;background:none;padding:0;border-radius:12px}
.btn-avatar .avatar{width:38px;height:38px;font-size:14px}
main{width:100%;max-width:760px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.nav-inf{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-inf button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;border-radius:12px;min-height:56px}
.nav-inf button[aria-current="page"]{color:var(--brand)}
.nav-inf button[aria-current="page"] .ico{stroke-width:2.2}
.nav-lat{display:none}
@media (min-width:960px){
  .app{grid-template-columns:240px 1fr}
  .nav-inf{display:none}
  .nav-lat{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .nav-lat .marca{margin:2px 6px 22px;color:var(--ink)}
  .nav-lat .marca span{color:var(--muted);opacity:1}
  .nav-lat button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:none;background:none;border-radius:12px;color:var(--muted);font-weight:700;text-align:left}
  .nav-lat button:hover{background:var(--surface-2);color:var(--ink)}
  .nav-lat button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  .barra-sup .logo{display:none}
  main{padding-bottom:40px}
}

/* ═══ Piezas ═══ */
.saludo{margin-bottom:16px}
.saludo h2{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.saludo p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.titulo-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.titulo-sec h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.viaje{display:flex;gap:14px;align-items:center;background:var(--night);color:#EAF0FB;border:none}
.viaje .ruta{font-weight:800;font-size:17px;letter-spacing:-.01em}
.viaje small{opacity:.75;display:block;font-size:13.5px}
.viaje .icono{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:14px;background:var(--surface-2);gap:4px}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{border:none;background:none;padding:11px 6px;border-radius:11px;font-weight:700;color:var(--muted);transition:background-color var(--t),color var(--t);min-width:0;line-height:1.2;overflow-wrap:break-word}
/* Margen: el botón del medio lleva la palabra más larga («Recomendado»). */
.seg.seg-nivel{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr)}
.seg-nivel button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;white-space:nowrap}
.seg-nivel button small{font-size:12px;font-weight:600;opacity:.8}
.lc-c{display:none}
.regla-esp:not(:empty){margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.regla-esp ul{margin:6px 0;padding-left:18px} .regla-esp small{color:var(--muted)}
.tramos ul{margin:4px 0 8px;padding-left:18px} .tramos li.tv{color:var(--warn)}
/* iPhone: los campos de fecha traen un ancho propio y se salen de la tarjeta. */
.campo input[type=date],.campo input[type=datetime-local],.campo input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
.campo input::-webkit-date-and-time-value{text-align:left}
@media (max-width:340px){.lc-l{display:none}.lc-c{display:inline}}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].ing{color:var(--ok)}
.seg button[aria-pressed="true"].egr{color:var(--bad)}
.etq{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}
.etq small{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;min-height:44px;transition:all var(--t-fast)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.monto{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);transition:border-color var(--t-fast)}
.monto:focus-within{border-color:var(--brand)}
.monto span{font-weight:700;color:var(--muted);font-size:20px}
.monto input{border:none;background:none;outline:none;font-size:38px;font-weight:800;letter-spacing:-.03em;width:100%;padding:2px 0;font-variant-numeric:tabular-nums}
.paso{display:flex;align-items:center;gap:10px}
.paso button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.paso output{min-width:48px;text-align:center;font-size:22px;font-weight:800}
.ayuda{font-size:13.5px;color:var(--muted);margin-top:8px}
.ayuda.alerta{color:var(--warn);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:1px solid transparent;font-weight:800;font-size:16px;background:var(--brand);color:var(--brand-ink);transition:filter var(--t-fast),transform var(--t-fast)}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.peligro{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.ancho{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.kpi b{display:block;font-size:clamp(19px,5.6vw,24px);font-weight:800;letter-spacing:-.03em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;font-weight:700;margin-top:2px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.lista{list-style:none;margin:0;padding:0}
.mov{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:none}
.mov .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.mov .ic.i{background:var(--ok-soft);color:var(--ok)} .mov .ic.e{background:var(--bad-soft);color:var(--bad)}
.mov b{display:block;font-weight:700;line-height:1.25}
.mov small{color:var(--muted);font-size:13px}
.mov .m{font-weight:800;text-align:right;white-space:nowrap}
.estado{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.estado.cola{background:var(--warn-soft);color:var(--warn)}
.estado.inac{background:var(--surface-2);color:var(--muted)}
.rol{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.rol.admin{background:var(--brand-soft);color:var(--brand)} .rol.super{background:var(--night);color:#EAF0FB} .rol.operador{background:var(--ok-soft);color:var(--ok)}
.fila-u{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;margin-bottom:8px;transition:border-color var(--t-fast)}
.fila-u:hover{border-color:var(--brand)}
.fila-u b{font-weight:700}
.fila-u small{display:block;color:var(--muted);font-size:13px}
.fila-u.inactivo{opacity:.62}
.diff{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;margin-top:10px;font-weight:800}
.diff.cero{background:var(--ok-soft);color:var(--ok)} .diff.falta{background:var(--bad-soft);color:var(--bad)} .diff.sobra{background:var(--warn-soft);color:var(--warn)}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.campo label{font-size:14px;font-weight:700}
.campo input,.campo select,.campo textarea{width:100%;min-width:0}
.campo input,.campo select{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;min-height:50px}
.campo input:focus,.campo select:focus{border-color:var(--brand);outline:none}
.bolsillo{display:flex;justify-content:space-between;gap:12px;align-items:center}
.bolsillo small{display:block;color:var(--muted);font-size:13px}
.bolsillo b.num{font-size:22px;font-weight:800;white-space:nowrap}
.grafico{width:100%;height:auto;display:block}
.grafico text{font:700 11px var(--font);fill:var(--muted)}
.grafico .vi{fill:var(--ok)} .grafico .ve{fill:var(--bad);opacity:.75}
.grafico .val{fill:var(--ink);font-size:10.5px}
.leyenda{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.alerta-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.alerta-item:last-child{border-bottom:none}
.alerta-item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.alerta-item small{display:block;color:var(--muted);font-size:13px}
.modulos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.modulo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;min-height:118px}
.modulo .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.modulo b{font-weight:800}
.modulo small{color:var(--muted);font-size:12.5px;font-weight:600}
.exc{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.barra-ocup{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.barra-ocup i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hist{font-size:13.5px}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
.hist li span:last-child{color:var(--muted);white-space:nowrap}

/* ═══ Hoja inferior ═══ */
dialog{border:none;padding:0;margin:auto auto 0;width:min(100%,560px);max-height:92vh;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
@media (min-width:700px){dialog{margin:auto;border-radius:24px}}
dialog::backdrop{background:rgba(6,12,24,.55);backdrop-filter:blur(2px)}
dialog[open]{animation:subir var(--t) var(--ease)}
@keyframes subir{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.hoja{padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.hoja h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hoja .desc{color:var(--muted);margin-top:4px}
.hoja .acciones{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.hoja .error{color:var(--bad);font-weight:700;font-size:14px;min-height:1.4em;margin-top:10px}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;font-weight:700;min-height:56px}
.acc + .acc{margin-top:8px}
.acc small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.acc.peligro{color:var(--bad)}
.acc[disabled]{opacity:.5;cursor:not-allowed}
.toasts{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:subir var(--t) var(--ease)}
.toast.mal{background:var(--bad);color:#fff}
@media (min-width:960px){.toasts{bottom:28px}}
.entrar{animation:aparecer .32s var(--ease) both}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ═══ Fase 1 ═══ */
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s var(--ease)}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th,.tabla td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.tabla th{font-size:12.5px;color:var(--muted);font-weight:700}
.tabla td.n{text-align:right;font-variant-numeric:tabular-nums}
.tabla-wrap{overflow-x:auto}
.archivo{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;cursor:pointer;background:var(--surface)}
.archivo:hover{border-color:var(--brand)}
.archivo input{position:absolute;opacity:0;width:1px;height:1px}
.campo textarea{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:inherit;min-height:70px}
.mes-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mes-chips .chip{white-space:nowrap}
.vacio{color:var(--muted);padding:18px 4px;text-align:center}
.senal .reloj{font-weight:600;color:var(--muted)}
.rechazo{border-left:3px solid var(--bad);padding:10px 12px;background:var(--bad-soft);border-radius:10px;margin-top:8px}
.rechazo small{display:block;color:var(--muted)}
.mas-btn{display:block;margin:12px auto 0}

/* ═══ Excursiones ═══ */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px -16px 16px;padding:0 16px;scrollbar-width:none}
.tabs button{font-weight:700;font-size:15px;background:none;border:none;color:var(--muted);padding:12px 10px 10px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.exc-item{display:block;width:100%;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow);transition:border-color var(--t-fast)}
.exc-item:hover{border-color:var(--brand)}
.exc-item b{font-size:16.5px}
.exc-item small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.exc-item .datos{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;font-weight:600}
.chip-est{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:2px;background:var(--surface-2);color:var(--muted)}
.chip-est.abierta{background:var(--ok-soft);color:var(--ok)} .chip-est.en_ruta{background:var(--warn-soft);color:var(--warn)} .chip-est.borrador{background:var(--brand-soft);color:var(--brand)} .chip-est.nuevo{background:var(--warn);color:var(--surface)}
.flujo{list-style:none;margin:6px 0 12px;padding:0}
.flujo li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;padding:6px 0}
.flujo li::before{content:attr(data-n);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted)}
.flujo li.hecho::before{content:"✓";background:var(--ok);color:var(--surface)}
.flujo li.ahora::before{background:var(--brand);color:var(--brand-ink)}
.flujo li.ahora b{color:var(--ink)} .flujo li b{font-weight:700;color:var(--muted)}
.flujo small{display:block;color:var(--muted);font-size:12.5px}
.compartir{border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:var(--r);padding:14px;margin:12px 0}
.compartir code{display:block;word-break:break-all;font-size:13.5px;background:var(--surface);padding:9px 10px;border-radius:10px;margin:8px 0;border:1px solid var(--line)}
.botones{display:flex;flex-wrap:wrap;gap:8px}
.kpi.alerta{border-color:var(--bad);background:var(--bad-soft)} .kpi.alerta b{color:var(--bad)}
.esq{position:relative;max-width:320px;margin:4px auto 0;padding:46px 14px 18px;border-radius:26px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.esq .muesca{position:absolute;top:-1.5px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:var(--surface-2);border:1.5px solid var(--line);border-top:none;border-radius:0 0 14px 14px;font-size:12px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.esq .grilla{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 8px}
.esq .sep{grid-column:1/-1;height:6px}
.esq .celda{aspect-ratio:1/1.1;min-width:0}
.as{width:100%;height:100%;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);transition:transform var(--t-fast)}
.as:active{transform:scale(.95)}
.as .n{font-size:19px;font-weight:800;line-height:1} .as .q{font-size:10px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as.libre{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.as.reservado{background:var(--warn-soft);border:1.5px dashed var(--warn);color:var(--warn)}
.as.confirmado{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.as.pagado{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.as.off{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.cond2{width:100%;height:100%;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.puerta2{display:flex;align-items:center;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.puerta2::after{content:"";position:absolute;right:-10px;top:-4px;bottom:-4px;border-right:2px dashed var(--line)}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
.ficha dt{color:var(--muted);font-size:14px} .ficha dd{margin:0;font-weight:700}
.previa{max-width:100%;max-height:200px;border-radius:12px;margin-top:8px;display:block}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.flota{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px}
.flota .btn{box-shadow:0 8px 22px rgba(0,0,0,.22)}
@media (min-width:960px){.flota{bottom:24px}}
#imprimir{display:none}
@media print{body>*:not(#imprimir){display:none!important}#imprimir{display:block;color:#000;font:12px/1.4 Arial,sans-serif}#imprimir table{width:100%;border-collapse:collapse}#imprimir th,#imprimir td{border:1px solid #999;padding:4px 6px;text-align:left}}

/* ═══ Toyota Hiace: foto interactiva + esquema, como el modelo ═══ */
.hiace{position:relative;left:50%;transform:translateX(-50%);width:min(1000px,calc(100vw - 24px));margin:28px 0 8px;padding:14px;border-radius:24px;
  background:linear-gradient(135deg,#ECEEEE 0%,#D6DADA 100%);color:#1E2427;display:grid;gap:16px;
  grid-template-areas:"titulo" "foto" "esquema"}
@media (min-width:760px){.hiace{grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"foto titulo" "foto esquema";padding:18px;column-gap:26px}}
.hiace .titulo{grid-area:titulo;text-align:center;align-self:end}
.hiace .titulo b{display:block;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;color:#1E2427}
.hiace .titulo span{font-size:16px;color:#3D4549}
/* La foto: cada asiento es un botón encima del respaldo */
.foto{grid-area:foto;align-self:start;aspect-ratio:652/683;position:relative;container-type:inline-size;border-radius:16px;overflow:hidden;background:#15191C;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.foto img{display:block;width:100%;height:100%;object-fit:cover}
.ho{position:absolute;padding:0;margin:0;border:none;background:transparent;border-radius:14%/12%;cursor:pointer;font:inherit;transition:box-shadow .2s ease,background-color .2s ease}
.ho .num{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:20%;font-family:var(--body);font-weight:700;
  font-size:15px;font-size:3.6cqw;line-height:1;pointer-events:none;transition:background-color .2s ease,box-shadow .2s ease}
.ho.libre .num{background:rgba(8,22,19,.94);border:1.5px solid #74F0C6;color:#A0F6D8;box-shadow:0 0 10px rgba(116,240,198,.55),inset 0 0 8px rgba(116,240,198,.18)}
.ho.libre:hover .num{box-shadow:0 0 18px rgba(116,240,198,.95),inset 0 0 10px rgba(116,240,198,.3)}
.ho.reservado,.ho.off{cursor:default;box-shadow:inset 0 -8px 14px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.4);
  background:linear-gradient(to top right,transparent calc(50% - 1.5px),rgba(110,116,120,.75) 50%,transparent calc(50% + 1.5px)),
             linear-gradient(to top left,transparent calc(50% - 1.5px),rgba(110,116,120,.75) 50%,transparent calc(50% + 1.5px)),
             linear-gradient(160deg,#DDE0E1 0%,#BEC3C5 100%)}
.ho.reservado .num,.ho.off .num{color:#5E666A;font-size:17px;font-size:4cqw}
.ho.off{opacity:.7}
.ho.elegido{background:rgba(242,181,58,.12);box-shadow:0 0 0 2px rgba(242,181,58,.95),0 0 30px 6px rgba(242,181,58,.55)}
.ho.elegido .num{background:#F2B53A;border:1.5px solid #FFD98A;color:#2A1E00;box-shadow:0 0 16px rgba(242,181,58,.85);animation:elegir .22s ease}
.ho:focus-visible{outline:3px solid #F2B53A;outline-offset:2px}
/* El esquema (tablet) */
.esquema{grid-area:esquema;display:flex;flex-direction:column;align-items:center}
.tablet{position:relative;width:100%;max-width:300px;padding:46px 16px 20px;border-radius:26px;background:linear-gradient(180deg,#F8F9F9,#EDEFEF);
  border:1.5px solid #C9CED0;box-shadow:0 12px 26px rgba(0,0,0,.13),inset 0 0 0 5px rgba(255,255,255,.65)}
.tablet .muesca{position:absolute;top:-1.5px;left:50%;transform:translateX(-50%);width:128px;height:26px;background:#E2E5E6;border:1.5px solid #C9CED0;border-top:none;
  border-radius:0 0 16px 16px;font-size:12px;color:#454D52;display:flex;align-items:center;justify-content:center}
.grilla{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.fila-sep{grid-column:1/-1;height:8px}
.celda{aspect-ratio:1/1.12;min-width:0}
.st{width:100%;height:100%;border-radius:10px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:2px;transition:background-color .2s ease,box-shadow .2s ease}
.st .n{font-size:20px;font-weight:700;line-height:1}
.st .q{font-size:10px;line-height:1.1;white-space:nowrap}
.st.libre{background:#EAF7F1;border:1.5px solid #8FE0C3;color:#2E7D63;box-shadow:0 0 9px rgba(110,220,180,.5)}
.st.libre:hover{box-shadow:0 0 14px rgba(110,220,180,.85)}
.st.reservado{background:#8B9094;border:1.5px solid #8B9094;color:#F3F5F6;cursor:default}
.st.off{background:transparent;border:1.5px dashed #A9AFB2;color:#848B8F;cursor:default}
.st.elegido{background:#E9AA2B;border:1.5px solid #E9AA2B;color:#2A1E00;box-shadow:0 0 12px rgba(233,170,43,.55);animation:elegir .22s ease}
.st.elegido .q{font-size:8.5px}
.st:focus-visible{outline:3px solid #E9AA2B;outline-offset:2px}
.cond{width:100%;height:100%;border-radius:10px;background:#E5E8E9;border:1px solid #CDD2D4;color:#2E3538;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}
.cond svg{width:22px;height:22px}
.puerta-e{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;font-weight:700;color:#3D4549}
.puerta-e::after{content:"";position:absolute;right:-12px;top:-4px;bottom:-4px;border-right:2px dashed #9AA1A4}
.leyenda-h{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:18px;font-size:14px;color:#2E3538}
.leyenda-h i{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-3px;margin-right:6px}
.leyenda-h .l1{background:#EAF7F1;border:1.5px solid #8FE0C3;box-shadow:0 0 5px rgba(110,220,180,.6)}
.leyenda-h .l2{background:#8B9094}
.leyenda-h .l3{background:#E9AA2B}
@keyframes elegir{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.ho,.ho .num,.st{transition:none}.ho.elegido .num,.st.elegido{animation:none}}
/* ── En la app: dentro de la columna, con los colores del tema ── */
.app .hiace{left:auto;transform:none;width:auto;margin:6px 0 8px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.app .hiace .titulo b{color:var(--ink)} .app .hiace .titulo span{color:var(--muted)}
@media (min-width:760px){.app .hiace{grid-template-columns:1.35fr 1fr}}
.app .tablet{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.app .tablet .muesca{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.app .cond{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.app .puerta-e{color:var(--muted)} .app .puerta-e::after{border-color:var(--line)}
.app .leyenda-h{color:var(--muted)}
.app .st.libre{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok);box-shadow:none}
.app .st .q{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-weight:700}
/* Estados de administración (el cliente solo ve libre / reservado / su elección) */
.ho.separado{background:rgba(242,181,58,.10);box-shadow:0 0 0 2px rgba(242,181,58,.9),0 0 18px 2px rgba(242,181,58,.45)}
.ho.separado .num{background:rgba(42,30,0,.9);border:1.5px dashed #F2B53A;color:#FFD98A}
.ho.confirmado,.ho.pagado{cursor:pointer;box-shadow:inset 0 -8px 14px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.4);
  background:linear-gradient(to top right,transparent calc(50% - 1.5px),rgba(110,116,120,.75) 50%,transparent calc(50% + 1.5px)),
             linear-gradient(to top left,transparent calc(50% - 1.5px),rgba(110,116,120,.75) 50%,transparent calc(50% + 1.5px)),
             linear-gradient(160deg,#DDE0E1 0%,#BEC3C5 100%)}
.ho.confirmado .num{color:#5E666A;font-size:17px;font-size:4cqw}
.ho.pagado .num{background:#1E4FD1;border:1.5px solid #9DB7FF;color:#fff;box-shadow:0 0 12px rgba(30,79,209,.6)}
.ho.off{cursor:default}
.st.separado{background:var(--warn-soft);border:1.5px dashed var(--warn);color:var(--warn)}
.st.confirmado{background:#8B9094;border:1.5px solid #8B9094;color:#F3F5F6}
.st.pagado{background:var(--brand);border:1.5px solid var(--brand);color:var(--brand-ink)}
.leyenda-h .l4{background:var(--warn-soft);border:1.5px dashed var(--warn)} .leyenda-h .l5{background:var(--brand)}

/* ═══ Calendario ═══ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-d{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}

.cal-c:active{transform:scale(.94)}
.cal-c .n{font-size:14px;line-height:1}
.cal-c.hoy{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal-c.fut{opacity:.35}

a.btn{text-decoration:none}
a.btn-mini{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none}

/* ═══ v4.0: panel y cotizador ═══ */
.hallazgo{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow)}

.graf{position:relative;height:240px} .graf.alto{height:300px}
.dos-g{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:760px){.dos-g{grid-template-columns:1fr 1fr}}
.mini-l .mov b{font-size:13.5px}
.opcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opc{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:96px}
.opc small{font-size:12px;color:var(--muted);font-weight:700}
.opc b{font-size:20px;font-weight:800}
